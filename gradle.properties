# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 forbids com.android.library + kotlin.multiplatform with the new built-in Kotlin DSL,
# but Compose Multiplatform 1.9.0's resource auto-config is incompatible with the new KMP-android
# plugin. Use the classic, Compose-MP-proven layout instead.
android.builtInKotlin=false
android.newDsl=false
# Gradle
org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2G -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.native=true
# KMP
kotlin.incremental.multiplatform=true
# Kotlin/Native compiler caches can fail to build (ClosedByInterruptException / "Failed to build
# cache for ...klib") when a link task is interrupted, and they aren't needed for this project.
# Disabling them avoids the flaky cache build. (matches CCC)
kotlin.native.cacheKind=none
# Compose
org.jetbrains.compose.experimental.uikit.enabled=true
