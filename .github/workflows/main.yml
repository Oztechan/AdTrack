name: AdTrack CI

on:
  push:
    branches:
      - develop
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # At 00:00 every day — nightly Release build + distribution

concurrency:
  # develop: unique group per run so all builds run freely; PRs: group by branch so they can be cancelled
  group: ${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  GOOGLE_OAUTH_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_ANDROID }}
  GOOGLE_OAUTH_CLIENT_ID_IOS: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_IOS }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  # iOS signing (App Store Connect API key) + Firebase App Distribution + match
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  IOS_DEBUG_FIREBASE_APP_ID: ${{ secrets.IOS_DEBUG_FIREBASE_APP_ID }}
  IOS_RELEASE_FIREBASE_APP_ID: ${{ secrets.IOS_RELEASE_FIREBASE_APP_ID }}
  GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
  SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
  MATCH_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
  # Android release signing — required so the nightly Release build (assembleRelease → packageRelease)
  # can sign the APK. Read by the release signingConfig in androidApp/build.gradle.kts via getSecret().
  ANDROID_KEY_STORE_PATH: ${{ secrets.ANDROID_KEY_STORE_PATH }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 5
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5
  CI: true
  # Debug on push/PR, Release on the nightly schedule
  BUILD_TYPE: ${{ github.event_name == 'schedule' && 'Release' || 'Debug' }}
  BUILD_TYPE_LOWERCASE: ${{ github.event_name == 'schedule' && 'release' || 'debug' }}

jobs:

  CodeAnalysis:
    runs-on: ubuntu-26.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      - name: Detekt
        run: ./gradlew detektAll

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Test:
    runs-on: macos-26
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      # JVM/Android only. The iOS native test binary links Crashlytics' cinterop, which forces
      # `-framework FirebaseCore` etc. — unavailable to a plain KMP test link. Same commonTest logic
      # runs here on the JVM; the iOS app links the Firebase SPM SDK at Xcode build time.
      # verifyRoborazziDebug enables golden-image comparison for the same test run: it fails when
      # UI pixels drift from the committed snapshots (run `recordRoborazziDebug` to accept a change).
      - name: Test (Android)
        run: ./gradlew testDebugUnitTest :common:verifyRoborazziDebug

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          # Roborazzi writes _compare/_actual images either next to the golden or into the module's
          # default output dir depending on capture mode — cover both, and warn (not ignore) so a
          # path mismatch is visible in the job log instead of silently uploading nothing.
          path: |
            common/build/outputs/roborazzi/
            common/build/reports/roborazzi/
            common/src/androidUnitTest/snapshots/*_compare.png
            common/src/androidUnitTest/snapshots/*_actual.png
            art/store/screenshots/**/*_compare.png
            art/store/screenshots/**/*_actual.png
          if-no-files-found: warn

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Coverage:
    runs-on: ubuntu-26.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      # Kover aggregates JVM/Android unit-test coverage at the root into build/reports/kover/report.xml.
      - name: Generate Coverage
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  AndroidBuild:
    runs-on: ubuntu-26.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      - name: Adding secret files
        uses: ./.github/actions/add-secret-files
        with:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          GOOGLE_SERVICES_JSON_ASC: ${{ secrets.GOOGLE_SERVICES_JSON_ASC }}
          ANDROID_RELEASE_KEYSTORE_ASC: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ASC }}

      - name: Assemble ${{ env.BUILD_TYPE }}
        run: ./gradlew :androidApp:assemble${{ env.BUILD_TYPE }}

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' || github.event_name == 'schedule'
        with:
          name: androidApp-apk
          path: androidApp/build/outputs/apk/${{ env.BUILD_TYPE_LOWERCASE }}/androidApp-${{ env.BUILD_TYPE_LOWERCASE }}.apk

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  # Signed .ipa build via Fastlane (match ad-hoc). Runs on every event so iOS build/signing
  # breakage is caught in the PR, not after merge. Debug on push/PR, Release on the nightly schedule.
  iOSBuild:
    runs-on: macos-26
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      - name: Adding secret files
        uses: ./.github/actions/add-secret-files
        with:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          GOOGLE_SERVICES_JSON_ASC: ${{ secrets.GOOGLE_SERVICES_JSON_ASC }}
          # Release plist on the nightly schedule, Debug plist on push/PR — matches BUILD_TYPE.
          GOOGLE_SERVICE_INFO_PLIST_ASC: ${{ github.event_name == 'schedule' && secrets.GOOGLE_SERVICE_INFO_PLIST_ASC_RELEASE || secrets.GOOGLE_SERVICE_INFO_PLIST_ASC_DEBUG }}

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Disable Kotlin incremental native for CI
        uses: Oztechan/Global/actions/disable-kotlin-incremental-native@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      - name: Set up Ruby
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: iosApp

      - name: Build ${{ env.BUILD_TYPE }}
        working-directory: iosApp
        run: bundle exec fastlane build${{ env.BUILD_TYPE }}

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iosApp-ipa
          path: iosApp/AdTrack.ipa

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  DistributeAndroid:
    runs-on: ubuntu-26.04
    needs: [ AndroidBuild ]
    # Debug after a merge to develop (push), Release on the nightly schedule. Never on PRs.
    if: github.event_name != 'pull_request'
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: androidApp-apk

      - name: Decrypt Firebase service account
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json.asc
          gpg -d --passphrase "$SECRET_PASSWORD" --batch firebase-service-account.json.asc > firebase-service-account.json

      - name: Firebase App Distribution (Android ${{ env.BUILD_TYPE }})
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{ github.event_name == 'schedule' && secrets.ANDROID_RELEASE_FIREBASE_APP_ID || secrets.ANDROID_DEBUG_FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: QA
          file: androidApp-${{ env.BUILD_TYPE_LOWERCASE }}.apk

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  DistributeIOS:
    runs-on: ubuntu-26.04
    needs: [ iOSBuild ]
    # After a merge to develop (Debug) or the nightly schedule (Release), never on PRs.
    if: github.event_name != 'pull_request'
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Clone Repo # needed for changelog_from_git_commits + fastlane config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download iOS Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iosApp-ipa
          path: iosApp

      - name: Decrypt Firebase service account
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json.asc
          gpg -d --passphrase "$SECRET_PASSWORD" --batch firebase-service-account.json.asc > firebase-service-account.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: iosApp

      - name: Distribute ${{ env.BUILD_TYPE }}
        working-directory: iosApp
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/firebase-service-account.json
        run: bundle exec fastlane distribute${{ env.BUILD_TYPE }}

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Notify:
    runs-on: ubuntu-26.04
    needs: [ CodeAnalysis, Test, Coverage, AndroidBuild, iOSBuild, DistributeAndroid, DistributeIOS ]
    if: always()
    steps:

      - name: Notify slack fail
        if: false == (needs.CodeAnalysis.outputs.status == 'success') ||
          false == (needs.Test.outputs.status == 'success') ||
          false == (needs.Coverage.outputs.status == 'success') ||
          false == (needs.AndroidBuild.outputs.status == 'success') ||
          false == (needs.iOSBuild.outputs.status == 'success') ||
          (false == (needs.DistributeAndroid.outputs.status == 'success') && github.event_name != 'pull_request') ||
          (false == (needs.DistributeIOS.outputs.status == 'success') && github.event_name != 'pull_request')
        uses: voxmedia/github-action-slack-notify-build@373da97827332b19e753c84d1e5b7937dbe0fbfa # v2
        with:
          channel: adtrack-github
          status: FAILED
          color: danger

  # Auto-approve Renovate PRs once the build/test jobs pass. The `needs` edge is the "all green" gate
  # (no watching/polling), and the shared reusable does the code-owner approval. Replaces the old
  # standalone renovate.yml that watched checks and timed out red.
  RenovateAutoApprove:
    needs: [ CodeAnalysis, Test, Coverage, AndroidBuild, iOSBuild ]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.head_ref, 'major')
    uses: Oztechan/Global/.github/workflows/reusable-renovate-approve.yml@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
