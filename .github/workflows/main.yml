name: AdTrack CI

on:
  push:
    branches:
      - develop
  pull_request:
  schedule:
    - cron: '0 0 * * *'  # At 00:00 every day — nightly Release build + distribution

concurrency:
  # develop: unique group per run so all builds run freely; PRs: group by branch so they can be cancelled
  group: ${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  GOOGLE_OAUTH_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_ANDROID }}
  GOOGLE_OAUTH_CLIENT_ID_IOS: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_IOS }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  # iOS signing (App Store Connect API key) + Firebase App Distribution + match
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  IOS_DEBUG_FIREBASE_APP_ID: ${{ secrets.IOS_DEBUG_FIREBASE_APP_ID }}
  IOS_RELEASE_FIREBASE_APP_ID: ${{ secrets.IOS_RELEASE_FIREBASE_APP_ID }}
  GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
  SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
  MATCH_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 5
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5
  CI: true
  # Debug on push/PR, Release on the nightly schedule
  BUILD_TYPE: ${{ github.event_name == 'schedule' && 'Release' || 'Debug' }}
  BUILD_TYPE_LOWERCASE: ${{ github.event_name == 'schedule' && 'release' || 'debug' }}

jobs:

  CodeAnalysis:
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@8610938e630b3ed86127765237fe3647b9fabd4f

      - name: Detekt
        run: ./gradlew detektAll

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Test:
    runs-on: macos-15
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@8610938e630b3ed86127765237fe3647b9fabd4f

      - name: Test (Android + iOS)
        run: ./gradlew testDebugUnitTest iosSimulatorArm64Test

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  AndroidBuild:
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@8610938e630b3ed86127765237fe3647b9fabd4f

      - name: Adding secret files
        uses: ./.github/actions/add-secret-files
        with:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          GOOGLE_SERVICES_JSON_ASC: ${{ secrets.GOOGLE_SERVICES_JSON_ASC }}
          ANDROID_RELEASE_KEYSTORE_ASC: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ASC }}

      - name: Assemble ${{ env.BUILD_TYPE }}
        run: ./gradlew :androidApp:assemble${{ env.BUILD_TYPE }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'push' || github.event_name == 'schedule'
        with:
          name: androidApp-apk
          path: androidApp/build/outputs/apk/${{ env.BUILD_TYPE_LOWERCASE }}/androidApp-${{ env.BUILD_TYPE_LOWERCASE }}.apk

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  # Signed .ipa build via Fastlane (match ad-hoc). Runs on every event so iOS build/signing
  # breakage is caught in the PR, not after merge. Debug on push/PR, Release on the nightly schedule.
  iOSBuild:
    runs-on: macos-15
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@8610938e630b3ed86127765237fe3647b9fabd4f

      - name: Adding secret files
        uses: ./.github/actions/add-secret-files
        with:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          GOOGLE_SERVICES_JSON_ASC: ${{ secrets.GOOGLE_SERVICES_JSON_ASC }}

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Disable Kotlin incremental native for CI
        run: |
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i '' '/kotlin.incremental.native/d' ~/.gradle/gradle.properties
          echo "kotlin.incremental.native=false" >> ~/.gradle/gradle.properties

      - name: Build ${{ env.BUILD_TYPE }}
        working-directory: iosApp
        run: fastlane build${{ env.BUILD_TYPE }}

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iosApp-ipa
          path: iosApp/AdTrack.ipa

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  DistributeAndroid:
    runs-on: ubuntu-24.04
    needs: [ AndroidBuild ]
    # Debug after a merge to develop (push), Release on the nightly schedule. Never on PRs.
    if: github.event_name != 'pull_request'
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Download Android APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: androidApp-apk

      - name: Decrypt Firebase service account
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json.asc
          gpg -d --passphrase "$SECRET_PASSWORD" --batch firebase-service-account.json.asc > firebase-service-account.json

      - name: Firebase App Distribution (Android ${{ env.BUILD_TYPE }})
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ github.event_name == 'schedule' && secrets.ANDROID_RELEASE_FIREBASE_APP_ID || secrets.ANDROID_DEBUG_FIREBASE_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: QA
          file: androidApp-${{ env.BUILD_TYPE_LOWERCASE }}.apk

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  DistributeIOS:
    runs-on: ubuntu-24.04
    needs: [ iOSBuild ]
    # After a merge to develop (Debug) or the nightly schedule (Release), never on PRs.
    if: github.event_name != 'pull_request'
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Clone Repo # needed for changelog_from_git_commits + fastlane config
        uses: actions/checkout@v6.0.2

      - name: Download iOS Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: iosApp-ipa
          path: iosApp

      - name: Decrypt Firebase service account
        env:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json.asc
          gpg -d --passphrase "$SECRET_PASSWORD" --batch firebase-service-account.json.asc > firebase-service-account.json

      # was necessary to use chown to fix permission issues in linux machines (same as CCC)
      - name: Distribute ${{ env.BUILD_TYPE }}
        working-directory: iosApp
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/firebase-service-account.json
        run: |
          sudo chown -R $(whoami) /var/lib/gems/
          fastlane distribute${{ env.BUILD_TYPE }}

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Notify:
    runs-on: ubuntu-24.04
    needs: [ CodeAnalysis, Test, AndroidBuild, iOSBuild, DistributeAndroid, DistributeIOS ]
    if: always()
    steps:

      - name: Notify slack fail
        if: false == (needs.CodeAnalysis.outputs.status == 'success') ||
          false == (needs.Test.outputs.status == 'success') ||
          false == (needs.AndroidBuild.outputs.status == 'success') ||
          false == (needs.iOSBuild.outputs.status == 'success') ||
          (false == (needs.DistributeAndroid.outputs.status == 'success') && github.event_name != 'pull_request') ||
          (false == (needs.DistributeIOS.outputs.status == 'success') && github.event_name != 'pull_request')
        uses: voxmedia/github-action-slack-notify-build@v2
        with:
          channel: adtrack-github
          status: FAILED
          color: danger
