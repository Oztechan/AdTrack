name: Build

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:     # Allows manual trigger

env:
  GOOGLE_OAUTH_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_ANDROID }}
  GOOGLE_OAUTH_CLIENT_ID_IOS: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_IOS }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  # Android release signing — required because `./gradlew build` assembles the release variant
  # (packageRelease). Read by the release signingConfig in androidApp/build.gradle.kts via getSecret();
  # without them the alias/passwords fall back to "" and packaging fails with a KeytoolException.
  ANDROID_KEY_STORE_PATH: ${{ secrets.ANDROID_KEY_STORE_PATH }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  CI: true

jobs:

  Build:
    runs-on: macos-15
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@8610938e630b3ed86127765237fe3647b9fabd4f

      - name: Adding secret files
        uses: ./.github/actions/add-secret-files
        with:
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
          GOOGLE_SERVICES_JSON_ASC: ${{ secrets.GOOGLE_SERVICES_JSON_ASC }}
          # `./gradlew build` assembles the release variant, which is release-signed.
          ANDROID_RELEASE_KEYSTORE_ASC: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ASC }}

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      # Full graph: detekt + JVM/Android tests + Android assemble + iOS framework link.
      # The iOS native test tasks are excluded: their test binary links Crashlytics' cinterop
      # (`-framework FirebaseCore` etc.), which a plain KMP test link can't resolve.
      - name: Build
        run: ./gradlew build -x iosSimulatorArm64Test -x iosX64Test

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Notify:
    runs-on: ubuntu-24.04
    needs: [ Build ]
    if: always()
    steps:

      - name: Notify slack fail
        if: false == (needs.Build.outputs.status == 'success')
        uses: voxmedia/github-action-slack-notify-build@v2
        with:
          channel: adtrack-github
          status: FAILED
          color: danger
